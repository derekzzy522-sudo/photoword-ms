<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>MemoLen - 间隔重复单词闪卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
:root{--primary:#2563bf;--success:#22a75d;--danger:#e53e3e;--bg:#f8fafc;--card:#ffffff;--text:#1e293b;--muted:#64748b;}
body{background:#f8fafc;color:#1e293b;padding:16px;max-width:720px;margin:0 auto;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
h1{font-size:22px;font-weight:700;color:var(--primary);}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;}
.tab{flex:1;padding:12px;border:none;border-radius:10px;background:#e2e8f0;color:var(--text);font-size:15px;}
.tab.active{background:var(--primary);color:#fff;}
.mode-bar{display:flex;gap:8px;margin-bottom:12px;}
.mode-btn{flex:1;padding:10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;}
.mode-btn.active{border-color:var(--primary);background:#eff6ff;}
#video-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;}
video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;}
#detect-tip{padding:10px;background:#fff;border-radius:10px;margin-bottom:12px;font-size:14px;color:var(--muted);min-height:44px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}
button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:500;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
canvas{display:none;}
</style>
</head>
<body>
<header>
<h1>MemoLen</h1>
</header>
<div class="tab-bar">
<button class="tab active" data-tab="scan">拍照识别</button>
<button class="tab" data-tab="review">复习单词</button>
<button class="tab" data-tab="list">单词本</button>
</div>

<div id="scan-view">
<div class="mode-bar">
<button class="mode-btn active" id="ocrModeBtn">OCR文字识别</button>
<button class="mode-btn" id="objModeBtn">物体识别</button>
</div>
<div id="video-wrap">
<video id="video" autoplay playsinline muted></video>
</div>
<div id="detect-tip">点击开启摄像头</div>
<div class="btn-row">
<button class="btn-primary" id="openCamBtn">开启摄像头</button>
<button class="btn-primary" id="switchCamBtn">切换前后摄像头</button>
<button class="btn-success" id="shotBtn">拍照识别</button>
<button class="btn-danger" id="closeCamBtn">关闭摄像头</button>
</div>
<canvas id="canvas"></canvas>
</div>

<div id="review-view" style="display:none;">
<div id="card-box" style="background:#fff;border-radius:12px;padding:30px;text-align:center;min-height:240px;">
<div id="card-word" style="font-size:28px;font-weight:bold;margin-bottom:12px;"></div>
<div id="card-zh" style="font-size:18px;color:var(--muted);display:none;"></div>
</div>
<div class="btn-row" style="margin-top:16px;">
<button class="btn-success" id="knowBtn">认识</button>
<button class="btn-danger" id="unknowBtn">不认识</button>
</div>
</div>

<div id="list-view" style="display:none;">
<div id="wordList"></div>
</div>

<script>
const wordDict = {
apple:{zh:"苹果",en:"apple"},
banana:{zh:"香蕉",en:"banana"},
cat:{zh:"猫",en:"cat"},
dog:{zh:"狗",en:"dog"},
book:{zh:"书",en:"book"},
pen:{zh:"笔",en:"pen"},
cup:{zh:"杯子",en:"cup"},
chair:{zh:"椅子",en:"chair"},
table:{zh:"桌子",en:"table"},
car:{zh:"小汽车",en:"car"}
};
let wordList = JSON.parse(localStorage.getItem("wordList")||"[]");
let useOcrMode = true;
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let stream = null;
let detector = null;
let cameraList = [];
let currentCamIndex = 0;

// 标签切换
document.querySelectorAll(".tab").forEach(tab=>{
tab.onclick = ()=>{
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
tab.classList.add("active");
const t = tab.dataset.tab;
document.getElementById("scan-view").style.display = t==="scan"?"block":"none";
document.getElementById("review-view").style.display = t==="review"?"block":"none";
document.getElementById("list-view").style.display = t==="list"?"block":"none";
if(t==="review") loadReviewCard();
if(t==="list") renderWordList();
}
})
// 模式切换
document.getElementById("ocrModeBtn").onclick = ()=>{
useOcrMode = true;
document.getElementById("ocrModeBtn").classList.add("active");
document.getElementById("objModeBtn").classList.remove("active");
document.getElementById("detect-tip").innerText = "OCR模式：对准英文单词拍照";
}
document.getElementById("objModeBtn").onclick = async ()=>{
useOcrMode = false;
document.getElementById("ocrModeBtn").classList.remove("active");
document.getElementById("objModeBtn").classList.add("active");
if(!detector){
document.getElementById("detect-tip").innerText = "正在加载物体识别模型，请稍候...";
try{
detector = await cocoSsd.load();
document.getElementById("detect-tip").innerText = "✅物体模型加载完成，可以拍照识别";
}catch(e){
console.error(e);
document.getElementById("detect-tip").innerText = "❌模型加载失败，请切换网络重试";
}
}else{
document.getElementById("detect-tip").innerText = "✅物体模型已就绪，可以拍照";
}
}

// 停止摄像头
async function stopCamera(){
if(stream){
stream.getTracks().forEach(track=>track.stop());
stream = null;
}
video.srcObject = null;
}

// 获取摄像头设备列表
async function loadCameraList(){
// 先临时拿一次权限，才能枚举设备
const tempStream = await navigator.mediaDevices.getUserMedia({video:true});
tempStream.getTracks().forEach(t=>t.stop());
const devices = await navigator.mediaDevices.enumerateDevices();
cameraList = devices.filter(d=>d.kind === "videoinput");
// 优先找后置：一般后置摄像头label包含back/后
let backIdx = cameraList.findIndex(item=>/back|后|后置/.test(item.label.toLowerCase()));
if(backIdx >=0) currentCamIndex = backIdx;
else currentCamIndex = 0;
}

// 打开指定摄像头
async function openCamera(){
await stopCamera();
if(cameraList.length === 0){
await loadCameraList();
}
if(cameraList.length === 0){
document.getElementById("detect-tip").innerText = "❌没有找到摄像头，请授予相机权限";
return;
}
const devId = cameraList[currentCamIndex].deviceId;
try{
stream = await navigator.mediaDevices.getUserMedia({
video:{deviceId:{exact:devId}}
});
video.srcObject = stream;
document.getElementById("detect-tip").innerText = `✅已开启摄像头：${cameraList[currentCamIndex].label || "摄像头"}`;
}catch(err){
console.error(err);
document.getElementById("detect-tip").innerText = "❌打开摄像头失败";
}
}

// 切换摄像头
document.getElementById("switchCamBtn").onclick = async ()=>{
if(cameraList.length === 0){
await loadCameraList();
}
if(cameraList.length <= 1){
document.getElementById("detect-tip").innerText = "⚠️只有1个摄像头，无法切换";
return;
}
currentCamIndex = (currentCamIndex + 1) % cameraList.length;
await openCamera();
}

// 关闭摄像头
document.getElementById("closeCamBtn").onclick = async ()=>{
await stopCamera();
document.getElementById("detect-tip").innerText = "摄像头已关闭";
}
document.getElementById("openCamBtn").onclick = openCamera;

// 拍照识别
document.getElementById("shotBtn").onclick = async function(){
if(!stream){
document.getElementById("detect-tip").innerText = "⚠️请先开启摄像头";
return;
}
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
ctx.drawImage(video,0,0);

if(useOcrMode){
// ========== OCR区域，你后续可以放回你的OCR代码 ==========
document.getElementById("detect-tip").innerText = "📸OCR拍照完成，等待识别";
// 这里放你原来的OCR逻辑
setTimeout(()=>{
document.getElementById("detect-tip").innerText = "✅OCR识别完成";
}, 600);
}else{
// 物体识别，增加模型判断，不再弹窗
if(!detector){
document.getElementById("detect-tip").innerText = "⚠️物体模型还没加载好，请等待模型加载完成再拍照";
return;
}
document.getElementById("detect-tip").innerText = "🔍正在识别物体...";
const res = await detector.detect(canvas);
if(!res.length){
document.getElementById("detect-tip").innerText = "❌没有识别到物体，请调整角度重试";
return;
}
const best = res[0].class;
const info = wordDict[best] || {zh:best,en:best};
const ok = addWord(best,info.zh,info.en);
if(ok){
document.getElementById("detect-tip").innerText = `✅识别成功：${best}【${info.zh}】，已加入单词本`;
}else{
document.getElementById("detect-tip").innerText = `ℹ️单词【${best}】已经存在单词本中`;
}
}
}

// 单词存储
function addWord(en,zh,full){
const exist = wordList.find(w=>w.en===en);
if(exist) return false;
wordList.push({en,zh,full,level:0,next:Date.now()});
saveWord();
return true;
}
function saveWord(){
localStorage.setItem("wordList",JSON.stringify(wordList));
}
function loadReviewCard(){
const now = Date.now();
const ready = wordList.filter(w=>w.next <= now);
if(!ready.length){
document.getElementById("card-word").innerText="暂无待复习单词";
document.getElementById("card-zh").style.display="none";
return;
}
const pick = ready[0];
document.getElementById("card-word").innerText = pick.en;
document.getElementById("card-zh").innerText = pick.zh;
document.getElementById("card-zh").style.display="none";
window.currentCard = pick;
}
document.getElementById("knowBtn").onclick = ()=>{
const c = window.currentCard;
if(!c) return;
c.level = Math.min(c.level+1,5);
c.next = Date.now() + [1000*60*5,1000*60*30,1000*60*60*3,1000*60*60*24,1000*60*60*24*7][c.level];
saveWord();
loadReviewCard();
}
document.getElementById("unknowBtn").onclick = ()=>{
const c = window.currentCard;
if(!c) return;
c.level=0;
c.next = Date.now();
saveWord();
loadReviewCard();
}
document.getElementById("card-word").onclick = ()=>{
document.getElementById("card-zh").style.display="block";
}
function renderWordList(){
const wrap = document.getElementById("wordList");
wrap.innerHTML = "";
wordList.forEach(w=>{
const div = document.createElement("div");
div.style="padding:12px;background:#fff;border-radius:8px;margin-bottom:8px";
div.innerText = `${w.en} - ${w.zh}`;
wrap.appendChild(div);
})
}
</script>
<!-- 引入coco-ssd -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
</body>
</html>
